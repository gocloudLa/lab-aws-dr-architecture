services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak-data:/var/lib/postgresql/data
  keycloak:
    build: ../app
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      LOCAL_MODE: "true"
      DB_HOST: postgres
      DB_NAME: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local-only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
      KC_CACHE: local
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
volumes:
  keycloak-data:
